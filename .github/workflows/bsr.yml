name: BSR

# Pushes proto/ to buf.build/trendvidia/protoregistry for each release tag;
# the tag becomes the module label (--git-metadata). The module must already
# exist on the BSR (push_disable_create), and BUF_TOKEN must be able to push
# to it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          push: true
          push_disable_create: true
          lint: false
          format: false
          breaking: false
