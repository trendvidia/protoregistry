// Fixture: 09_wkt_refinements
// Exercises: type aliases whose base is a well-known type — Timestamp,
// Duration, and Any — per the §6.2 binding rules (RFC-001, issue #61).
//
// Expected behavior:
//   - `type Future` / `type ShortDelay`: `this` binds to the ENGINE-NATIVE
//     temporal value (rule 2), so comparisons read naturally. `now()` is
//     the §5.4 builtin, evaluated run-stably (rule 5); the language has
//     no duration literal, so the bound is a declared `function` taking
//     the Duration (rule 2), and `shorter_than` is the one call in
//     Expression.calls.
//   - `type ErrorPayload`: `this` binds to the STRUCTURED Any (rule 3),
//     never auto-unpacked. §5.4 has no field selection, so the type_url
//     check is a declared `function` taking the Any (`has_type_url`),
//     which rule 3 names as the canonical pattern since issue #324.
//   - Lowering is unaffected by the binding rules: each alias records its
//     literal base FQN in `FileTypeDecls` (`google.protobuf.Timestamp`,
//     `google.protobuf.Duration`, `google.protobuf.Any`).

syntax = "proto3";

package fixtures.wkt;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "protowire/schema/v1/annotations.proto";

// §6.2 rule 2: no duration literal in the language — a bound is a
// declared function. §5.4: no field selection — so is a type_url check.
function shorter_than(value: google.protobuf.Duration, seconds: int64);
function has_type_url(value: google.protobuf.Any, url: string);

// Engine-native temporal binding: reads as a time comparison, not as
// field access on {seconds, nanos}.
type Future = google.protobuf.Timestamp
  @validate(this > now(), code = "wkt.not_future");

type ShortDelay = google.protobuf.Duration
  @validate(shorter_than(this, 60), code = "wkt.delay_too_long");

// Any never unwraps: refinement is by type_url, compared inside a
// declared function that takes the Any (§5.4: no field selection).
type ErrorPayload = google.protobuf.Any
  @validate(has_type_url(this, "type.googleapis.com/google.rpc.Status"),
            code = "wkt.wrong_payload_type");

message Job {
  Future scheduled_at = 1;
  ShortDelay retry_backoff = 2;
  ErrorPayload last_error = 3;
}
